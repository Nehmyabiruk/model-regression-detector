[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "model-regression-detector"
version = "0.1.0"
description = "Production-oriented framework for detecting machine learning model regressions."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn==1.8.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "xgboost",
    "sqlalchemy",
    "psycopg[binary]",
    "reportlab",
    "python-dotenv",
    "openai",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true